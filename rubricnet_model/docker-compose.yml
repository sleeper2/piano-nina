services:
  rubricnet:
    build: .
    image: rubricnet-model
    environment:
      - WORKERS=${WORKERS:-4}
      - LIMIT=${LIMIT:-0}
      - TEMPO=${TEMPO:-marked}
    volumes:
      - ../score_musicxml:/data/score_musicxml:ro
      - ../806_2_score_dataset_clean.xlsx:/data/dataset.xlsx:ro
      - ./results:/app/results
